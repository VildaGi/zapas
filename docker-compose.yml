services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: zapas
      POSTGRES_USER: zapas
      POSTGRES_PASSWORD: zapas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/zapas
      DB_USER: zapas
      DB_PASSWORD: zapas
    ports:
      - "8080:8080"

volumes:
  pgdata:
