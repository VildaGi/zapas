spring:
  application:
    name: zapas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zapas}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
  flyway:
    # По умолчанию (обычный Postgres) дополнительно создаётся заглушка схемы auth.
    locations: classpath:db/migration,classpath:db/local
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: "2"

server:
  port: ${PORT:8080}
  # За обратным прокси (Render, Railway, nginx...) берём схему и IP клиента из X-Forwarded-*.
  # Нужно, чтобы cookie сессии получала флаг Secure на HTTPS.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  default-currency: ${APP_CURRENCY:EUR}
  # Через запятую; пусто = CORS выключен (фронт отдаётся с того же origin)
  cors-allowed-origins: ${APP_CORS_ORIGINS:}
  # Сколько дней живёт сессия после входа
  session-days: ${APP_SESSION_DAYS:30}
